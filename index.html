<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花靈物語 Fairy Garden</title>
<style>
:root { --panel: rgba(18, 24, 38, .88); --line: rgba(255,255,255,.12); --text: #eef0f8; --dim: #a8b0c8; --accent: #c9a7ff; --gold: #ffd98a; --ok: #8ff0b0; --bad: #ff8f8f; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a20; color: var(--text);
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif; font-size: 15px; user-select: none; }
canvas#cv { position: fixed; inset: 0; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: rgba(201,167,255,.22); border-color: var(--accent); }
button.on, button.primary { background: rgba(201,167,255,.35); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
select, input { font: inherit; color: var(--text); background: #1d2438; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type=number] { width: 64px; }
h2 { margin: 0 0 6px; font-size: 20px; } h3 { margin: 14px 0 6px; font-size: 15px; color: var(--gold); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#top { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 16px;
  background: linear-gradient(rgba(12,16,28,.92), rgba(12,16,28,.7)); border-bottom: 1px solid var(--line); }
#lvTitle { font-size: 18px; font-weight: 700; color: var(--gold); min-width: 280px; }
#top .grp { display: flex; gap: 4px; align-items: center; } #top .grp span { color: var(--dim); margin-right: 4px; }
#clock { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
#resbar { position: fixed; top: 52px; left: 0; right: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 16px; background: rgba(12,16,28,.78); border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; overflow: hidden; white-space: nowrap; }
#resbar .lbl { color: var(--gold); margin-right: 6px; } #resbar .res { background: rgba(255,255,255,.06); border-radius: 6px; padding: 1px 7px; } #resbar .res b { color: var(--gold); margin-left: 3px; } #resbar .res small { color: var(--dim); }
#resbar .res.full { outline: 1px solid var(--bad); } #resbar .res.full b { color: var(--bad); }
#left { position: fixed; top: 96px; left: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-height: calc(100vh - 220px); }
#goals { width: 350px; padding: 10px 14px; flex: none; }
#roster { padding: 10px 14px; overflow: auto; min-height: 0; }
.phead { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 16px; } .phead h3 { margin: 0; } .phead span { color: var(--dim); }
table.roster { border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.roster th { color: var(--dim); font-weight: 400; text-align: left; padding: 2px 6px; white-space: nowrap; }
.roster td { padding: 3px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
.roster tr.sel td { background: rgba(255,217,138,.1); }
.roster select { font-size: 13px; max-width: 130px; } .roster input[type=number] { width: 52px; font-size: 13px; }
.roster .bar { width: 56px; } .roster .stc { max-width: 230px; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
button.link { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline dotted; }
.goal { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.goal:last-child { border-bottom: 0; } .goal.done { color: var(--dim); } .goal.done .chk { color: var(--ok); }
.goal .prog { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; } .goal button { padding: 2px 10px; grid-column: 2 / 4; justify-self: start; }
#tools { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; display: flex; gap: 6px; padding: 8px; }
#tools button { display: grid; grid-template-columns: 30px 1fr; text-align: left; align-items: center; padding: 6px 10px; min-width: 150px; }
#tools button .ic { font-size: 22px; } #tools button small { display: block; color: var(--dim); font-size: 12px; }
#side { position: fixed; top: 96px; right: 12px; width: 430px; max-height: calc(100vh - 220px); overflow: auto; padding: 14px 16px; }
#side .sub { color: var(--dim); font-size: 13px; } #side p { color: var(--dim); line-height: 1.6; margin: 6px 0; }
.inv { display: flex; flex-wrap: wrap; gap: 6px; } .it { background: rgba(255,255,255,.06); border-radius: 8px; padding: 3px 8px; font-size: 14px; }
.it b { color: var(--gold); margin-left: 4px; } .it.full { outline: 1px solid var(--bad); } .it.full b { color: var(--bad); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dev { background: rgba(201,167,255,.08); border: 1px solid rgba(201,167,255,.3); border-radius: 10px; padding: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
.dev.empty { background: rgba(255,255,255,.03); border-style: dashed; border-color: var(--line); color: var(--dim); }
.dev .devh { display: flex; justify-content: space-between; font-weight: 700; color: var(--text); } .dev .devh button { padding: 0 6px; }
.dev select { width: 100%; font-size: 12px; } .dev button small { color: var(--dim); }
.bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a98bff, #ff9df0); }
.bar.en i { background: linear-gradient(90deg, #ffc94a, #8ff0b0); }
.st { color: var(--dim); } .warn { color: var(--bad); } .note { color: #ffe9a8; }
.cast { color: var(--gold); font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-width: 180px; padding: 6px 4px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; margin: 6px 0; } .kv span:nth-child(odd) { color: var(--dim); }
#hint { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); max-width: 820px; padding: 10px 18px; color: #fff7dc; line-height: 1.6; }
#hint:empty { display: none; }
#toasts { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(20,26,40,.94); border: 1px solid var(--accent); border-radius: 10px; padding: 8px 16px; animation: tf 3.2s forwards; }
.toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--ok); }
@keyframes tf { 0% { opacity: 0; transform: translateY(-6px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#tip { position: fixed; pointer-events: none; background: rgba(10,14,24,.9); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; color: var(--dim); }
#tip:empty { display: none; }
#perf { position: fixed; left: 12px; bottom: 12px; z-index: 50; pointer-events: none; padding: 8px 10px; font: 12px/1.6 ui-monospace, Consolas, monospace; color: #cfe; background: rgba(10,14,24,.85); border: 1px solid var(--line); border-radius: 6px; white-space: pre; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,8,16,.6); }
#menu { background: radial-gradient(ellipse at 50% 30%, #2a3d55 0%, #101828 60%, #070b14 100%); flex-direction: column; }
#menu h1 { font-size: 84px; margin: 0; letter-spacing: 4px; background: linear-gradient(90deg, #ffd98a, #ff9df0, #c9a7ff, #7fd8ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(201,167,255,.25); }
#menu .en { color: var(--dim); font-size: 20px; letter-spacing: 6px; margin-top: 4px; }
#menu .ver { color: var(--accent); font-size: 14px; margin-top: 6px; letter-spacing: 1px; }
#menu .tag { color: var(--dim); margin: 6px 0 36px; font-size: 18px; letter-spacing: 2px; }
.cards { display: flex; gap: 22px; }
.card { width: 400px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { color: var(--gold); } .card p { color: var(--dim); line-height: 1.6; margin: 0; flex: 1; font-size: 14px; } .card .meta { color: var(--accent); font-size: 13px; }
.card.locked { opacity: .5; }
.wipe { justify-content: center; margin-top: 18px; }
.help { margin-top: 30px; color: var(--dim); font-size: 14px; line-height: 1.8; text-align: center; }
.dlg { width: 640px; padding: 26px 30px; } .dlg p { white-space: pre-line; line-height: 1.8; color: #dfe3f2; }

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="resbar" title="點一下選取中央魔法之花"></div>
  <div id="top">
    <div id="lvTitle"></div>
    <div class="grp" id="speed"><span>速度</span><button data-speed="0">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>

<script id="fg-core">
// ===== Fairy Garden 核心邏輯：純資料與模擬，不碰 DOM（tests/ 會單獨載入這段）=====
(function () {
'use strict';
const SQ3 = Math.sqrt(3);

// ---------- 六角格（pointy-top、axial 座標）----------
const hex = {
  DIRS: [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]],
  key: (q, r) => q + ',' + r,
  parse(k) { const [q, r] = k.split(',').map(Number); return { q, r }; },
  dist(a, b) { const dq = a.q - b.q, dr = a.r - b.r; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; },
  neighbors(h) { return hex.DIRS.map(([dq, dr]) => ({ q: h.q + dq, r: h.r + dr })); },
  round(fq, fr) {
    const fs = -fq - fr;
    let q = Math.round(fq), r = Math.round(fr); const s = Math.round(fs);
    const dq = Math.abs(q - fq), dr = Math.abs(r - fr), ds = Math.abs(s - fs);
    if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
    return { q: q + 0, r: r + 0 };
  },
  line(a, b) {
    const n = hex.dist(a, b), out = [];
    for (let i = 0; i <= n; i++) {
      const t = n === 0 ? 0 : i / n;
      out.push(hex.round(a.q + (b.q - a.q) * t + 1e-6, a.r + (b.r - a.r) * t + 1e-6));
    }
    return out;
  },
  toXY(q, r) { return { x: SQ3 * (q + r / 2), y: 1.5 * r }; },
  fromXY(x, y) { const fr = y / 1.5; return hex.round(x / SQ3 - fr / 2, fr); },
};

// ---------- 資料表 ----------
const ITEMS = {

  '木枝':   { icon: '🪵', color: '#c08a55', desc: '在森林採集的建材' },
  '月石':   { icon: '🪨', color: '#c4c8e8', desc: '在岩地採集的建材' },

  '風語':   { icon: '🍃', color: '#8ff0b0', desc: '岩地上的結界收集' },
  '土息':   { icon: '🌰', color: '#e0a868', desc: '森林裡的結界收集' },
  '滋養露': { icon: '🧪', color: '#7dffb0', desc: '維護花田的養分' },

  anchor:  { name: '光之錨',       icon: '🕯️', cost: { '月石': 2, '結界晶': 1 }, terrain: ['grass', 'meadow', 'rock', 'forest', 'water'] },
};
const TERRAIN = {

const WILD_MAX = 3, WILD_TIME = 8, WILD_REGROW = 40;   // 野生月光花：每格上限、每朵秒數、長回一朵的秒數
const BUILD_TIME = { farm: 5, barrier: 10, anchor: 10, flower: 30 };
// 物件所在的層：地面層與低空層各自獨立，同一格每層一個（之後可再加層）
const LAYER = { farm: 'ground', flower: 'ground', barrier: 'air', anchor: 'air' };
const CH_HOP = 7;
const CH_SPEED = 4;
const CH_INTERVAL = 1.5;
const DEFAULT_RADIUS = 20;
const STORAGE_BASE = 60, STORAGE_STEP = 30;
const SUMMON_COST = { '花蜜': 3, '月光花': 4 };
const CAST_TIME = { summon: 10, ether: 8, device: 5, storage: 6 };   // 魔法之花各種施法的秒數
const SUMMON_TIME = CAST_TIME.summon;
const CAST_NAME = { summon: '召喚精靈', ether: '擴充乙太空間', device: '安裝設備', storage: '擴建倉庫' };
const FAIRY_NAMES = ['鈴蘭', '薄荷', '露珠', '星點', '苜蓿', '蒲公英', '楓糖', '晨曦', '月桂', '雛菊', '琥珀', '青苔', '柳絮', '螢火', '雲雀', '杏仁'];
const FLOWER_COLORS = ['#c9a7ff', '#7fd8ff', '#ffb37f', '#9cffb0'];
const FLOWER_NAMES = ['中央魔法之花', '湖畔之花', '花海之花', '星光之花'];

// ---------- 關卡 ----------
const T = (kind, item) => ({ kind, item: item || null });
const LEVELS = {
  1: {
    title: '第一章　中央魔法之花', minutes: '約 10 分鐘', seed: 11,
    intro: '德魯伊在森林深處喚醒了沉睡的中央魔法之花。兩隻精靈從花中醒來，等著你分派第一份工作。\n\n本章學習：擺放藍圖讓精靈搬材料建造、種植與採收月光花、在乙太空間釀造花蜜（精靈的食物），以及用精靈列表分派任務。',
    features: { fert: false }, unlocked: ['farm'], recipes: ['nectar'],
    terrain: [['forest', 5, -2, 2], ['forest', -5, 5, 2], ['forest', -6, -1, 1], ['water', -2, -5, 2], ['rock', 7, 2, 1], ['meadow', 8, -7, 2], ['water', 10, 3, 2]],
    flowers: [{ q: 0, r: 0, central: true, slots: 2, storage: { '月光花': 6, '花蜜': 4, '木枝': 4 }, devices: [['brewer', 'nectar']] }],
    fairies: [{ home: 0, task: T('build') }, { home: 0, task: T('build') }],
    goals: [
      { kind: 'build', type: 'farm', n: 3, text: '建造 3 塊花田', hint: '下方選「花田」，點花附近的草地放藍圖。精靈預設的任務是「維護」，會自己搬材料去施工。木枝不夠時，在左側精靈列表把一隻改成「收集 木枝」。' },

// ---------- 工具 ----------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const has = (st, need) => Object.entries(need).every(([k, n]) => (st[k] || 0) >= n);
function pay(st, cost) { if (!has(st, cost)) return false; for (const [k, n] of Object.entries(cost)) st[k] -= n; return true; }
const costText = cost => Object.entries(cost).map(([k, n]) => k + '×' + n).join('、');
const flowers = s => Object.values(s.ents).filter(e => e.type === 'flower');
const centralOf = s => flowers(s).find(t => t.central);
const posOf = e => hex.toXY(e.q, e.r);
const layerOf = e => LAYER[e.type === 'blueprint' ? e.target : e.type];
function entOn(s, q, r, layer) { const t = s.tiles[hex.key(q, r)]; if (!t) return null; for (const id of t.ents) if (s.ents[id] && layerOf(s.ents[id]) === layer) return id; return null; }
const groundFree = (s, t) => !entOn(s, t.q, t.r, 'ground');
function unlink(s, q, r, id) { const t = s.tiles[hex.key(q, r)]; t.ents = t.ents.filter(x => x !== id); }
// 地格可採集的資源：地面層沒有東西；花海還要有野生花
const tileRes = (s, t) => { const res = TERRAIN[t.t].res; if (!res || !groundFree(s, t)) return null; if (res === '月光花' && !(t.wild >= 1)) return null; return res; };
const addStat = (s, item, n) => { s.stats.produced[item] = (s.stats.produced[item] || 0) + n; };
// 倉庫上限：所有物品共用同一個上限值，但每種物品各自和上限比較（A 存滿不擋 B）
const room = (t, item) => Math.max(0, t.cap - (t.storage[item] || 0));
// 存入倉庫：超過上限的部分消失，回傳實際存入的數量
function store(t, item, n) {
  const k = Math.min(n, room(t, item));
  if (k > 0) { t.storage[item] = (t.storage[item] || 0) + k; if (t.central) { const p = posOf(t); emit('store', p.x, p.y, { item }); } }
  return k;
}
const fx = [];
const emit = (type, x, y, extra) => { if (fx.length < 200) fx.push(Object.assign({ type, x, y }, extra || {})); };

// ---------- 建立關卡 ----------
const RADIUS = 16;
function newGame(level) {
  const L = LEVELS[level];
  const R = rng(L.seed);
  const s = {
    v: 5, level, time: 0, nextId: 1, tiles: {}, ents: {}, fairies: {}, channels: {}, claims: {},
    features: Object.assign({}, L.features), unlocked: L.unlocked.slice(), recipes: L.recipes.slice(),
    stats: { built: {}, produced: {}, expanded: 0, orders: 0 },
    goals: L.goals.map((g, i) => Object.assign({ id: 'g' + i, done: false }, g)), complete: false, completeAt: null,
  };
  for (let q = -RADIUS; q <= RADIUS; q++) for (let r = -RADIUS; r <= RADIUS; r++) {
    if (hex.dist({ q: 0, r: 0 }, { q, r }) > RADIUS) continue;
    let t = 'grass';
    if (hex.dist({ q: 0, r: 0 }, { q, r }) > 3) { const x = R(); if (x < 0.05) t = 'forest'; else if (x < 0.075) t = 'rock'; else if (x < 0.09) t = 'meadow'; }
    s.tiles[hex.key(q, r)] = { q, r, t, v: R(), ents: [] };
  }
  for (const [t, cq, cr, rad] of L.terrain) {
    for (const k in s.tiles) {
      const tile = s.tiles[k], d = hex.dist(tile, { q: cq, r: cr });
      if (d <= rad && (d < rad || R() < 0.6)) tile.t = t;
    }
  }
  for (const k in s.tiles) if (hex.dist(s.tiles[k], { q: 0, r: 0 }) <= 2) s.tiles[k].t = 'grass';
  for (const k in s.tiles) if (s.tiles[k].t === 'meadow') s.tiles[k].wild = WILD_MAX;
  const fids = L.flowers.map(F => {
    s.tiles[hex.key(F.q, F.r)].t = 'grass';
    const id = spawnBuilding(s, 'flower', F.q, F.r, { central: !!F.central, slots: F.slots, storage: Object.assign({}, F.storage) });
    F.devices.forEach(([type, rec, limit], i) => {
      const t = s.ents[id];
      t.devices[i] = newDevice(type); t.devices[i].recipe = rec; if (limit) t.devices[i].limit = limit;
    });
    return id;
  });
  for (const [q, r] of L.farms || []) { s.tiles[hex.key(q, r)].t = 'grass'; const id = spawnBuilding(s, 'farm', q, r); s.ents[id].fert = 2; }
  for (const [q, r] of L.barriers || []) spawnBuilding(s, 'barrier', q, r);
  for (const F of L.fairies) { const f = newFairy(s, fids[F.home]); setTask(s, f, F.task); }
  return s;
}

function spawnBuilding(s, type, q, r, opts) {
  opts = opts || {};
  const id = opts.id || ('e' + s.nextId++);
  const tile = s.tiles[hex.key(q, r)];
  const e = { id, type, q, r };
  if (type === 'flower') {
    const n = flowers(s).length;
    Object.assign(e, { central: !!opts.central, name: opts.central ? FLOWER_NAMES[0] : FLOWER_NAMES[Math.min(n, 3)],
      color: FLOWER_COLORS[n % FLOWER_COLORS.length], storage: opts.storage || {}, cap: STORAGE_BASE, capLevel: 0, slots: opts.slots || 2, devices: [], cast: null });
    while (e.devices.length < e.slots) e.devices.push(null);
  } else if (type === 'farm') Object.assign(e, { planted: false, growth: 0, fert: FERT_MAX / 2 });
  else if (type === 'barrier') Object.assign(e, { elem: BARRIER_ELEM[tile.t] || '陽光', buf: 0, charge: 2, t: 0, fast: tile.t === 'meadow' });
  s.ents[id] = e;
  tile.ents.push(id);
  return id;
}

function newDevice(type) { return { type, recipe: DEVICES[type].recipes ? DEVICES[type].recipes[0] : null, prog: 0, limit: DEVICES[type].limit, keep: DEVICES[type].keep, state: 'idle' }; }

// 待機點：自家魔法之花周圍一圈，每隻精靈依編號用黃金角錯開
function standbyXY(s, f) {
  const p = posOf(s.ents[f.home]), a = f.slot * 2.39996, r = 0.95 + 0.22 * (f.slot % 3);
  return { x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r * 0.8 };
}

function newFairy(s, homeId) {
  const t = s.ents[homeId];
  const n = Object.keys(s.fairies).length;
  const id = 'f' + s.nextId++;
  const f = s.fairies[id] = { id, name: FAIRY_NAMES[n % FAIRY_NAMES.length], home: homeId, slot: n, x: 0, y: 0, atKey: hex.key(t.q, t.r),
    hold: null, energy: 100, task: { kind: 'build', item: null, at: null, radius: DEFAULT_RADIUS }, act: null, bubble: '', msg: '', claim: null };
  const sp = standbyXY(s, f); f.x = sp.x; f.y = sp.y;
  return f;
}

// ---------- 設施操作 ----------
const ops = {
  plant(s, farm) { if (farm.type !== 'farm' || farm.planted) return false; farm.planted = true; farm.growth = 0; return true; },
  harvest(s, farm) {
    if (farm.type !== 'farm' || !farm.planted || farm.growth < 1) return 0;
    farm.planted = false; farm.growth = 0;
    if (s.features.fert) farm.fert = Math.max(0, farm.fert - 1);
    addStat(s, '月光花', HARVEST_YIELD);
    const p = posOf(farm); emit('burst', p.x, p.y, { color: ITEMS['月光花'].color });
    return HARVEST_YIELD;
  },
  // 把物品交給設施，回傳對方收下的數量。魔法之花一律全收，超過倉庫上限的部分消失
  deliver(s, id, item, n) {
    const e = s.ents[id]; if (!e || n <= 0) return 0;
    if (e.type === 'flower') { store(e, item, n); return n; }
    if (e.type === 'blueprint') {
      const k = Math.max(0, Math.min(missing(e, item), n));
      if (k > 0) e.have[item] = (e.have[item] || 0) + k;
      return k;
    }
    if (e.type === 'farm' && item === '滋養露' && s.features.fert) {
      const k = Math.max(0, Math.min(n, Math.ceil((FERT_MAX - e.fert) / NOURISH_HARVESTS))); e.fert = Math.min(FERT_MAX, e.fert + NOURISH_HARVESTS * k); return k;
    }
    if (e.type === 'barrier' && item === '結界晶') {
      const k = Math.max(0, Math.min(n, 5 - Math.floor(e.charge))); e.charge = Math.min(5, e.charge + k); return k;
    }
    return 0;
  },
  // 施工：材料到齊後累積施工秒數，滿了就完工。回傳是否完工
  construct(s, id, sec) {
    const bp = s.ents[id];
    if (!bp || bp.type !== 'blueprint' || !has(bp.have, bp.need)) return false;
    bp.work = Math.min(bp.time, bp.work + sec);
    if (bp.work < bp.time - 1e-9) return false;
    completeBlueprint(s, bp);
    return true;
  },
};
const missing = (bp, item) => (bp.need[item] || 0) - (bp.have[item] || 0);

function completeBlueprint(s, bp) {
  const { id, q, r, target } = bp;
  delete s.ents[id]; unlink(s, q, r, id);
  spawnBuilding(s, target, q, r, { id });
  s.ents[id].built = true;
  s.stats.built[target] = (s.stats.built[target] || 0) + 1;
  const p = hex.toXY(q, r); emit('build', p.x, p.y);
}

// ---------- 指令（玩家操作）----------
const ok = extra => Object.assign({ ok: true }, extra || {});
const no = reason => ({ ok: false, reason });

function setTask(s, f, task) {
  const kind = TASKS[task.kind] ? task.kind : 'idle', items = TASKS[kind].items;
  const item = items && items.includes(task.item) ? task.item : null;
  const radius = Math.max(1, Math.min(40, Math.round(+task.radius || DEFAULT_RADIUS)));
  let at = null;
  if (task.at && task.at.flower && s.ents[task.at.flower]) at = { flower: task.at.flower };
  else if (task.at && Number.isFinite(task.at.q) && Number.isFinite(task.at.r)) at = { q: task.at.q, r: task.at.r };
  releaseClaim(s, f);
  f.task = { kind, item, at, radius };
  if (f.act && f.act.op !== 'refuel') f.act = null;
  f.msg = ''; f.bubble = '';
}

const castBusy = t => '正在施法：' + CAST_NAME[t.cast.kind] + '，請等施法結束';
function startCast(t, kind, extra) {
  t.cast = Object.assign({ kind, t: 0, dur: CAST_TIME[kind] }, extra || {});
  const p = posOf(t); emit('castStart', p.x, p.y, { id: t.id, kind });
}
// 施法結束：依種類生效
function finishCast(s, t) {
  const c = t.cast; t.cast = null;
  const p = posOf(t);
  if (c.kind === 'summon') { const f = newFairy(s, t.id); emit('summoned', f.x, f.y, { id: f.id, color: t.color }); return; }
  if (c.kind === 'ether') { t.slots++; t.devices.push(null); s.stats.expanded++; }
  else if (c.kind === 'storage') { t.cap += STORAGE_STEP; t.capLevel++; }
  else if (c.kind === 'device' && t.devices[c.slot]) delete t.devices[c.slot].install;
  emit('castDone', p.x, p.y, { id: t.id, kind: c.kind, color: t.color });
}

const cmd = {
  canPlace(s, type, q, r) {
    const B0 = BUILDS[type]; const tile = s.tiles[hex.key(q, r)];
    if (!B0 || !s.unlocked.includes(type)) return no('尚未解鎖');
    if (!tile) return no('超出地圖');
    if (entOn(s, q, r, LAYER[type])) return no(LAYER[type] === 'air' ? '這格的低空已經有東西了' : '這格的地面已經有東西了');
    if (!B0.terrain.includes(tile.t)) return no(B0.name + '不能蓋在' + TERRAIN[tile.t].name + '上');
    if (type === 'flower' && flowers(s).some(t => hex.dist(t, tile) < 4)) return no('魔法之花之間至少相隔 4 格');
    return ok();
  },
  placeBlueprint(s, type, q, r) {
    const c = cmd.canPlace(s, type, q, r); if (!c.ok) return c;
    const id = 'e' + s.nextId++;
    s.ents[id] = { id, type: 'blueprint', target: type, q, r, need: Object.assign({}, BUILDS[type].cost), have: {}, work: 0, time: BUILD_TIME[type] };
    s.tiles[hex.key(q, r)].ents.push(id);
    return ok({ id });
  },
  // 拆除：藍圖退回已搬入的材料；建築退回一半建造成本；都放回中央魔法之花
  demolish(s, id) {
    const e = s.ents[id]; if (!e) return no('不存在');
    if (e.type === 'flower') return no('魔法之花不能拆除');
    const back = e.type === 'blueprint' ? e.have : Object.fromEntries(Object.entries(BUILDS[e.type].cost).map(([k, n]) => [k, Math.floor(n / 2)]));
    const c = centralOf(s); for (const [k, n] of Object.entries(back)) if (n) store(c, k, n);
    for (const ch of Object.values(s.channels)) if (ch.nodes.includes(id)) delete s.channels[ch.id];
    delete s.ents[id]; unlink(s, e.q, e.r, id); delete s.claims[id];
    return ok();
  },
  setTask(s, fid, task) { const f = s.fairies[fid]; if (!f) return no('沒有這隻精靈'); setTask(s, f, task || {}); return ok(); },
  summonFairy(s, tid) {
    const t = s.ents[tid];
    if (t.cast) return no(castBusy(t));
    const casting = flowers(s).filter(x => x.cast && x.cast.kind === 'summon').length;
    if (Object.keys(s.fairies).length + casting >= 16) return no('精靈已達上限 16 隻');
    if (!pay(t.storage, SUMMON_COST)) return no('需要 ' + costText(SUMMON_COST));
    startCast(t, 'summon');
    return ok();
  },
  etherCost(t) { return { '月石': 2 * t.slots, '月光花': 2 * t.slots }; },
  expandEther(s, tid) {
    const t = s.ents[tid];
    if (!s.unlocked.includes('expand')) return no('尚未解鎖');
    if (t.cast) return no(castBusy(t));
    if (t.slots >= 9) return no('已達上限 9 格');
    const cost = cmd.etherCost(t);
    if (!pay(t.storage, cost)) return no('需要 ' + costText(cost));
    startCast(t, 'ether');
    return ok();
  },
  storageCost(t) { const k = t.capLevel + 1; return { '月石': 4 * k, '木枝': 4 * k }; },
  expandStorage(s, tid) {
    const t = s.ents[tid], cost = cmd.storageCost(t);
    if (t.cast) return no(castBusy(t));
    if (!pay(t.storage, cost)) return no('需要 ' + costText(cost));
    startCast(t, 'storage');
    return ok();
  },
  addDevice(s, tid, slot, type) {
    const t = s.ents[tid], D = DEVICES[type];
    if (!D || !s.unlocked.includes(type)) return no('尚未解鎖');
    if (slot < 0 || slot >= t.slots || t.devices[slot]) return no('這一格不能安裝');
    if (t.cast) return no(castBusy(t));
    if (!pay(t.storage, D.cost)) return no('需要 ' + costText(D.cost));
    t.devices[slot] = newDevice(type); t.devices[slot].install = true;
    startCast(t, 'device', { slot });
    return ok();
  },
  removeDevice(s, tid, slot) {
    const t = s.ents[tid], d = t.devices[slot]; if (!d) return no('空格');
    for (const [k, n] of Object.entries(DEVICES[d.type].cost)) store(t, k, n);
    if (t.cast && t.cast.kind === 'device' && t.cast.slot === slot) t.cast = null;
    t.devices[slot] = null; return ok();
  },
  setRecipe(s, tid, slot, rid) {
    const d = s.ents[tid].devices[slot];
    if (!d || !RECIPES[rid] || !s.recipes.includes(rid)) return no('無法使用這個配方');
    const allow = DEVICES[d.type].recipes; if (allow && !allow.includes(rid)) return no('這台設備不能做這個配方');
    d.recipe = rid; d.prog = 0; return ok();
  },
  setLimit(s, tid, slot, n) { const d = s.ents[tid].devices[slot]; if (!d) return no('空格'); d.limit = Math.max(0, Math.min(999, n | 0)); return ok(); },
  setKeep(s, tid, slot, n) { const d = s.ents[tid].devices[slot]; if (!d) return no('空格'); d.keep = Math.max(0, Math.min(999, n | 0)); return ok(); },
  assignHome(s, fid, tid) { const f = s.fairies[fid]; if (!s.ents[tid] || s.ents[tid].type !== 'flower') return no('不是魔法之花'); f.home = tid; return ok(); },
  buildChannel(s, nodes, item) {
    if (!s.unlocked.includes('channel')) return no('尚未解鎖');
    if (nodes.length < 2) return no('至少需要起點與終點');
    const es = nodes.map(id => s.ents[id]);
    if (es.some(e => !e)) return no('節點不存在');
    const a = es[0], z = es[es.length - 1];
    if (!['barrier', 'flower'].includes(a.type)) return no('起點必須是結界或魔法之花');
    if (z.type !== 'flower' || z === a) return no('終點必須是另一朵魔法之花');
    if (es.slice(1, -1).some(e => e.type !== 'anchor')) return no('中繼點必須是光之錨');
    if (new Set(nodes).size !== nodes.length) return no('節點不能重複');
    for (let i = 1; i < es.length; i++) if (hex.dist(es[i - 1], es[i]) > CH_HOP) return no('相鄰節點距離超過 ' + CH_HOP + ' 格');
    if (a.type === 'flower' && !ITEMS[item]) return no('從魔法之花出發的通道要指定運送的物品');
    const id = 'c' + s.nextId++;
    s.channels[id] = { id, nodes: nodes.slice(), item: a.type === 'flower' ? item : null, timer: 0, transit: [] };
    return ok({ id });
  },
  removeChannel(s, id) { delete s.channels[id]; return ok(); },
  fulfillOrder(s, gid) {
    const g = s.goals.find(x => x.id === gid);
    if (!g || g.kind !== 'order' || g.done) return no('沒有這張訂單');
    const all = flowers(s).sort((a, b) => (b.central ? 1 : 0) - (a.central ? 1 : 0));
    const total = all.reduce((n, t) => n + (t.storage[g.item] || 0), 0);
    if (total < g.n) return no(g.item + ' 不足（共 ' + total + '/' + g.n + '）');
    let left = g.n;
    for (const t of all) { const k = Math.min(left, t.storage[g.item] || 0); t.storage[g.item] -= k; left -= k; }
    g.done = true; s.stats.orders++;
    return ok();
  },
};

// ---------- 精靈：指令單 → 狀態機 ----------
function releaseClaim(s, f) { if (f.claim && s.claims[f.claim] && s.claims[f.claim].f === f.id) delete s.claims[f.claim]; f.claim = null; }
const claimedByOther = (s, f, id) => { const c = s.claims[id]; return c && c.f !== f.id && c.until > s.time; };

function taskCenter(s, f) {
  const a = f.task.at;
  if (a && a.flower && s.ents[a.flower]) return s.ents[a.flower];
  if (a && Number.isFinite(a.q)) return a;
  return s.ents[f.home];
}

// 在範圍內找最近（以精靈目前位置計）的目標
function nearest(s, f, list) {
  let best = null, bd = Infinity;
  for (const o of list) { const p = hex.toXY(o.q, o.r), d = (p.x - f.x) ** 2 + (p.y - f.y) ** 2; if (d < bd) { bd = d; best = o; } }
  return best;
}
function inRange(s, f) { const c = taskCenter(s, f), r = f.task.radius; return o => c && hex.dist(o, c) <= r; }
function entsWhere(s, f, pred, claimable) {
  const ok2 = inRange(s, f);
  return Object.values(s.ents).filter(e => pred(e) && ok2(e) && !(claimable && claimedByOther(s, f, e.id)));
}
function tilesWithRes(s, f, item) {
  const ok2 = inRange(s, f);
  return Object.values(s.tiles).filter(t => tileRes(s, t) === item && ok2(t));
}

// 待命：先飛回自己的待機點，到了再原地等
function idleAt(s, f, msg) {
  f.msg = msg; f.bubble = '…';
  const sp = standbyXY(s, f), home = s.ents[f.home];
  if (Math.hypot(sp.x - f.x, sp.y - f.y) > 1e-6) f.act = { op: 'move', tx: sp.x, ty: sp.y, key: hex.key(home.q, home.r), idle: true };
  else f.act = { op: 'wait', t: 0, dur: 1, idle: true };
}
const isAtTile = (f, t) => { const p = hex.toXY(t.q, t.r); return f.atKey === hex.key(t.q, t.r) && Math.abs(f.x - p.x) < 1e-6 && Math.abs(f.y - p.y) < 1e-6; };
function goTo(s, f, o, claim) {
  if (isAtTile(f, o)) return false;
  releaseClaim(s, f);
  if (claim) { s.claims[o.id] = { f: f.id, until: s.time + 30 }; f.claim = o.id; }
  const p = hex.toXY(o.q, o.r);
  f.act = { op: 'move', tx: p.x, ty: p.y, key: hex.key(o.q, o.r) };
  return true;
}
// 走到目標；已經在目標上就開始對它做事（act 帶著目標物件 id）
function workAt(s, f, e, op, extra, claim) { if (!goTo(s, f, e, claim)) f.act = Object.assign({ op, t: 0, dur: 0.5, id: e.id }, extra || {}); }
const goHomeDrop = (s, f) => workAt(s, f, s.ents[f.home], 'drop');
const goHomeTake = (s, f, item, n) => workAt(s, f, s.ents[f.home], 'take', { item, n: Math.max(1, Math.min(CAP, n)) });

const needsNourish = (s, e) => e.type === 'farm' && s.features.fert && e.fert <= FERT_MAX - NOURISH_HARVESTS;
const needsCrystal = e => e.type === 'barrier' && e.charge < 1;
const ready = e => e.type === 'blueprint' && has(e.have, e.need);

const PLAN = {
  idle(s, f) { if (f.hold) return goHomeDrop(s, f); idleAt(s, f, '待命中'); },

  collect(s, f) {
    const item = f.task.item, home = s.ents[f.home];
    if (!item) { if (f.hold) return goHomeDrop(s, f); return idleAt(s, f, '請選擇物品'); }
    const isElem = Object.values(BARRIER_ELEM).includes(item);
    if (f.hold && f.hold.item !== item) return goHomeDrop(s, f);
    const tile = s.tiles[f.atKey];
    const onSource = tile && tileRes(s, tile) === item && isAtTile(f, tile);
    // 還站在來源上、手上沒滿：繼續採集
    if (!isElem && f.hold && f.hold.n < CAP && onSource) return (f.act = { op: 'gather', t: 0, item });
    if (f.hold) return goHomeDrop(s, f);
    if (room(home, item) <= 0) return idleAt(s, f, '家裡的' + item + '已達倉庫上限，暫停收集');
    if (isElem) {
      const src = nearest(s, f, entsWhere(s, f, e => e.type === 'barrier' && e.elem === item && e.buf >= 1, true));
      if (!src) return idleAt(s, f, '範圍內沒有可收取' + item + '的結界');
      return workAt(s, f, src, 'collect', null, true);
    }
    if (onSource) return (f.act = { op: 'gather', t: 0, item });
    const src = nearest(s, f, tilesWithRes(s, f, item));
    if (!src) return idleAt(s, f, '範圍內找不到' + item + '的來源');
    goTo(s, f, src);
  },

  farm(s, f) {
    const home = s.ents[f.home];
    if (f.hold && f.hold.item !== '月光花') return goHomeDrop(s, f);
    if (f.hold && f.hold.n >= 3) return goHomeDrop(s, f);
    const ripe = room(home, '月光花') > 0 ? nearest(s, f, entsWhere(s, f, e => e.type === 'farm' && e.planted && e.growth >= 1, true)) : null;
    if (ripe && (!f.hold || f.hold.n + HARVEST_YIELD <= CAP)) return workAt(s, f, ripe, 'harvest', { dur: 1 }, true);
    const empty = nearest(s, f, entsWhere(s, f, e => e.type === 'farm' && !e.planted, true));
    if (empty) {
      if (f.hold) return workAt(s, f, empty, 'plant', { dur: 1 }, true);
      if ((home.storage['月光花'] || 0) > 0) return goHomeTake(s, f, '月光花', 1);
      return idleAt(s, f, '家裡沒有月光花可以播種');
    }
    if (f.hold) return goHomeDrop(s, f);
    const anyRipe = entsWhere(s, f, e => e.type === 'farm' && e.planted && e.growth >= 1).length;
    if (anyRipe && room(home, '月光花') <= 0) return idleAt(s, f, '家裡的月光花已達倉庫上限，暫停採收');
    const farms = entsWhere(s, f, e => e.type === 'farm').length;
    idleAt(s, f, farms ? '花田生長中，等待收成' : '範圍內沒有花田');
  },

  // 維護：搬材料、施工，沒有藍圖時維護花田與結界
  build(s, f) {
    const home = s.ents[f.home];
    const bps = entsWhere(s, f, e => e.type === 'blueprint' && Object.keys(e.need).some(k => missing(e, k) > 0));
    if (f.hold) {
      const it = f.hold.item;
      const bp = nearest(s, f, bps.filter(e => missing(e, it) > 0));
      if (bp) return workAt(s, f, bp, 'drop');
      const pred = it === '滋養露' ? (e => needsNourish(s, e)) : it === '結界晶' ? needsCrystal : null;
      const target = pred && nearest(s, f, entsWhere(s, f, pred, true));
      if (target) return workAt(s, f, target, 'drop', null, true);
      return goHomeDrop(s, f);
    }
    const site = nearest(s, f, entsWhere(s, f, ready));
    if (site) return workAt(s, f, site, 'construct', { dur: 1e9 });
    const lacking = new Set();
    for (const bp of bps.sort((a, b) => hex.dist(a, home) - hex.dist(b, home))) {
      for (const k of Object.keys(bp.need)) {
        const m = missing(bp, k); if (m <= 0) continue;
        if ((home.storage[k] || 0) > 0) return goHomeTake(s, f, k, m);
        lacking.add(k);
      }
    }
    for (const [item, pred] of [['滋養露', e => needsNourish(s, e)], ['結界晶', needsCrystal]]) {
      if ((home.storage[item] || 0) > 0 && entsWhere(s, f, pred, true).length) return goHomeTake(s, f, item, 1);
    }
    if (lacking.size) return idleAt(s, f, '家裡缺少藍圖需要的材料：' + [...lacking].join('、'));
    idleAt(s, f, '範圍內沒有要維護或維護的工作');
  },

  haul(s, f) {
    const item = f.task.item, home = s.ents[f.home];
    if (!item) { if (f.hold) return goHomeDrop(s, f); return idleAt(s, f, '請選擇物品'); }
    const a = f.task.at, dst = a && a.flower ? s.ents[a.flower] : null;
    if (!dst || dst.type !== 'flower' || dst.id === home.id) { if (f.hold) return goHomeDrop(s, f); return idleAt(s, f, '運送需要把目標地點設為另一朵魔法之花'); }
    if (f.hold && f.hold.item !== item) return goHomeDrop(s, f);
    if (f.hold) return workAt(s, f, dst, 'drop');
    if (room(dst, item) <= 0) return idleAt(s, f, dst.name + '的' + item + '已達倉庫上限');
    if ((home.storage[item] || 0) <= 0) return idleAt(s, f, '家裡沒有' + item);
    goHomeTake(s, f, item, CAP);
  },
};

function addHold(f, item, n) { if (!f.hold) f.hold = { item, n: 0 }; f.hold.n = Math.min(CAP, f.hold.n + n); }
const actFail = (s, f, msg) => { releaseClaim(s, f); f.msg = msg; f.act = { op: 'wait', t: 0, dur: 0.5 }; };

function doAct(s, f, h) {
  const a = f.act;
  const done = () => { f.act = null; };
  switch (a.op) {
    case 'move': {
      const dx = a.tx - f.x, dy = a.ty - f.y, d = Math.hypot(dx, dy), sp = SPEED * (f.energy <= 0 ? 0.5 : 1) * h;
      if (d <= sp) { f.x = a.tx; f.y = a.ty; f.atKey = a.key; done(); } else { f.x += dx / d * sp; f.y += dy / d * sp; }
      return;
    }
    case 'wait': a.t += h; if (a.t >= a.dur) done(); return;
    case 'gather': {
      const tile = s.tiles[f.atKey];
      if (!tile || tileRes(s, tile) !== a.item) { if (f.hold) return done(); return actFail(s, f, '資源消失了'); }
      a.t += h;
      const per = a.item === '月光花' ? WILD_TIME : 1.5;
      if (a.t >= per - 1e-9) {
        a.t -= per; addHold(f, a.item, 1); addStat(s, a.item, 1);
        if (a.item === '月光花') tile.wild--;
        if (f.hold.n >= CAP) done();
      }
      return;
    }
    case 'construct': {
      const bp = s.ents[a.id];
      if (!bp || bp.type !== 'blueprint' || !ready(bp) || !isAtTile(f, bp)) return done();
      if (ops.construct(s, a.id, h)) done();
      return;
    }
    case 'refuel': {
      const home = s.ents[f.home];
      if (a.phase === 'go') {
        const p = posOf(home), dx = p.x - f.x, dy = p.y - f.y, d = Math.hypot(dx, dy), sp = SPEED * 0.8 * h;
        if (d <= sp) { f.x = p.x; f.y = p.y; f.atKey = hex.key(home.q, home.r); a.phase = 'rest'; } else { f.x += dx / d * sp; f.y += dy / d * sp; }
        return;
      }
      if (a.phase === 'rest') {
        if ((home.storage['花蜜'] || 0) >= 1) { home.storage['花蜜'] -= 1; a.phase = 'eat'; a.t = 0; f.bubble = '🍯'; return; }
        f.bubble = 'z'; f.msg = '家裡沒有花蜜，正在休息'; f.energy = Math.min(100, f.energy + 1.5 * h);
        if (f.energy >= 100) { f.msg = ''; done(); }
        return;
      }
      a.t += h;
      if (a.t >= 0.5) { f.energy = 100; f.msg = ''; done(); }
      return;
    }
  }
  a.t += h;
  if (a.t < a.dur) return;
  const e = s.ents[a.id];
  if (!e || !isAtTile(f, e)) return actFail(s, f, '目標不見了');
  switch (a.op) {
    case 'plant':
      if (e.type !== 'farm' || e.planted || !f.hold || f.hold.item !== '月光花') return actFail(s, f, '無法播種');
      f.hold.n--; if (!f.hold.n) f.hold = null; ops.plant(s, e); break;
    case 'harvest': {
      const y = ops.harvest(s, e);
      if (!y) return actFail(s, f, '沒有可採收的花');
      addHold(f, '月光花', y); break;
    }
    case 'take': {
      if (e.type !== 'flower') return actFail(s, f, '不在魔法之花');
      const k = Math.min(a.n, e.storage[a.item] || 0, CAP - (f.hold ? f.hold.n : 0));
      if (k <= 0) return actFail(s, f, '家裡沒有' + a.item);
      e.storage[a.item] -= k; addHold(f, a.item, k); break;
    }
    case 'drop': {
      if (!f.hold) return actFail(s, f, '無法放下');
      const k = ops.deliver(s, e.id, f.hold.item, f.hold.n);
      if (k <= 0) return actFail(s, f, '對方不需要' + f.hold.item);
      f.hold.n -= k; if (!f.hold.n) f.hold = null; break;
    }
    case 'collect': {
      if (e.type !== 'barrier') return actFail(s, f, '不在結界');
      const k = Math.min(e.buf, CAP - (f.hold ? f.hold.n : 0));
      if (k <= 0 || (f.hold && f.hold.item !== e.elem)) return actFail(s, f, '收不了');
      e.buf -= k; addHold(f, e.elem, k); break;
    }
  }
  releaseClaim(s, f);
  done();
}

function stepFairy(s, f, h) {
  if (!f.act) {
    if (f.energy < 15) { releaseClaim(s, f); f.act = { op: 'refuel', phase: 'go', t: 0 }; }
    else { f.msg = ''; f.bubble = ''; PLAN[f.task.kind](s, f); }
  }
  const a = f.act;
  const busy = a && a.op !== 'wait' && !(a.op === 'refuel' && a.phase !== 'go');
  f.energy = Math.max(0, f.energy - (busy ? 1 : 0.3) * h);
  if (f.act) doAct(s, f, h);
}

// ---------- 世界推進 ----------
function stepWorld(s, h) {
  s.time += h;
  for (const id in s.ents) {
    const e = s.ents[id];
    if (e.type === 'farm' && e.planted && e.growth < 1) {
      const slow = s.features.fert && e.fert <= 0 ? 2.5 : 1;
      e.growth = Math.min(1, e.growth + h / (GROW_TIME * slow));
    } else if (e.type === 'barrier') {
      const rate = (e.charge > 0 ? 5 : 20) * (e.fast ? 0.7 : 1);
      e.t += h;
      if (e.t >= rate) {
        e.t = 0;
        if (e.buf < 10) { e.buf++; addStat(s, e.elem, 1); if (e.charge > 0) e.charge = Math.max(0, Math.round(e.charge * CRYSTAL_UNITS - 1) / CRYSTAL_UNITS); }
      }
    } else if (e.type === 'flower') stepFlower(s, e, h);
  }
  for (const k in s.tiles) {
    const t = s.tiles[k];
    if (t.t === 'meadow' && t.wild < WILD_MAX) { t.wt = (t.wt || 0) + h; if (t.wt >= WILD_REGROW) { t.wt = 0; t.wild++; } }
  }
  for (const id in s.fairies) stepFairy(s, s.fairies[id], h);
  for (const id in s.channels) stepChannel(s, s.channels[id], h);
  for (const g of s.goals) if (!g.done && g.kind !== 'order') { const [c, n] = goalProgress(s, g); if (c >= n) g.done = true; }
  if (!s.complete && s.goals.every(g => g.done)) { s.complete = true; s.completeAt = s.time; }
}

function stepFlower(s, t, h) {
  if (t.cast) { t.cast.t += h; if (t.cast.t >= t.cast.dur - 1e-9) finishCast(s, t); }
  for (const d of t.devices) {
    if (!d || !d.recipe || d.install) continue;
    const R = RECIPES[d.recipe], outItem = Object.keys(R.out)[0];
    // 產物達倉庫上限就暫停；保留原料：每種原料用掉後至少還要剩 keep 個
    const blocked = room(t, outItem) <= 0 ? 'storefull' : (t.storage[outItem] || 0) >= d.limit ? 'full' : null;
    const ready = Object.entries(R.in).every(([k, n]) => (t.storage[k] || 0) >= n + (d.keep || 0));
    if (d.prog === 0 && (blocked || !ready)) { d.state = blocked || 'wait'; continue; }
    d.prog += h; d.state = 'work';
    if (d.prog < R.time) continue;
    if (blocked || !ready) { d.prog = R.time; d.state = blocked || 'wait'; continue; }
    pay(t.storage, R.in);
    for (const [k, n] of Object.entries(R.out)) { store(t, k, n); addStat(s, k, n); }
    d.prog = 0;
    const p = posOf(t); emit('craft', p.x, p.y, { color: ITEMS[outItem].color });
  }
}

function channelPoints(s, ch) { return ch.nodes.map(id => posOf(s.ents[id])); }
function channelLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return L; }

function stepChannel(s, ch, h) {
  const src = s.ents[ch.nodes[0]], dst = s.ents[ch.nodes[ch.nodes.length - 1]];
  if (!src || !dst) { delete s.channels[ch.id]; return; }
  ch.timer = Math.min(CH_INTERVAL, ch.timer + h);
  // 目的地該物品（扣掉運送中的）還有空位才送出
  const it0 = src.type === 'barrier' ? src.elem : ch.item;
  if (ch.timer >= CH_INTERVAL && room(dst, it0) > ch.transit.length) {
    let item = null;
    if (src.type === 'barrier' && src.buf >= 1) { src.buf--; item = src.elem; }
    else if (src.type === 'flower' && (src.storage[ch.item] || 0) >= 1) { src.storage[ch.item]--; item = ch.item; }
    if (item) { ch.transit.push({ d: 0, item }); ch.timer = 0; }
  }
  const len = channelLength(channelPoints(s, ch));
  for (const it of ch.transit) it.d += CH_SPEED * h;
  while (ch.transit.length && ch.transit[0].d >= len) store(dst, ch.transit.shift().item, 1);
}

function goalProgress(s, g) {
  const n = g.n;
  switch (g.kind) {
    case 'build': return [s.stats.built[g.type] || 0, n];
    case 'buildNear': {
      const c = Object.values(s.ents).filter(e => e.type === g.type && e.built &&
        Object.values(s.tiles).some(t => t.t === g.near && hex.dist(t, e) <= g.range)).length;
      return [c, n];
    }
    case 'produce': return [s.stats.produced[g.item] || 0, n];
    case 'fairies': return [Object.keys(s.fairies).length, n];
    case 'expand': return [s.stats.expanded, n];
    case 'device': return [flowers(s).reduce((k, t) => k + t.devices.filter(d => d && d.type === g.dev).length, 0), n];
    case 'channels': return [Object.keys(s.channels).length, n];

function act(name, el) {
  const s = UI.s, sel = UI.sel, slot = +el.dataset.slot;
  const r = (res, good) => { if (res && !res.ok) toast(res.reason, 'bad'); else if (good) toast(good, 'good'); UI.sideHtml = ''; UI.goalsHtml = ''; };
  switch (name) {
    case 'order': { const res = FG.cmd.fulfillOrder(s, el.dataset.id); if (res.ok) SND.good(); return r(res, '訂單已交付！'); }
    case 'toggle': UI.collapse.goals = !UI.collapse.goals; return r();
    case 'summon': return r(FG.cmd.summonFairy(s, sel.id), '開始施法召喚精靈');
    case 'expand': return r(FG.cmd.expandEther(s, sel.id), '開始施法：擴充乙太空間');
    case 'expstore': return r(FG.cmd.expandStorage(s, sel.id), '開始施法：擴建倉庫');
    case 'adddev': return r(FG.cmd.addDevice(s, sel.id, slot, el.dataset.type), '開始施法：安裝設備');
    case 'rmdev': return r(FG.cmd.removeDevice(s, sel.id, slot));
    case 'self': UI.sel = { kind: 'fairy', id: el.dataset.id }; return r();
    case 'demolish': { const res = FG.cmd.demolish(s, sel.id); if (res.ok) UI.sel = null; return r(res); }
    case 'rmch': return r(FG.cmd.removeChannel(s, el.dataset.id));
  }
}
function change(name, el) {
  const s = UI.s, sel = UI.sel, slot = +el.dataset.slot;
  if (name === 'recipe') FG.cmd.setRecipe(s, sel.id, slot, el.value);
  else if (name === 'limit') FG.cmd.setLimit(s, sel.id, slot, +el.value);
  else if (name === 'keep') FG.cmd.setKeep(s, sel.id, slot, +el.value);
  else if (name === 'home') FG.cmd.assignHome(s, sel.id, el.value);

}

  if (d.btn === 2 && UI.pickFor) { UI.pickFor = null; toast('已取消點選'); return; }
  if (d.btn === 2) { if (UI.tool === 'channel' && UI.chPath.length) { UI.chPath.pop(); UI.sideHtml = ''; } else setTool(null); return; }
  if (d.btn === 0) clickMap(e.clientX, e.clientY);
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const before = s2w(e.clientX, e.clientY);
  UI.cam.z = Math.max(0.4, Math.min(2.4, UI.cam.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  const after = s2w(e.clientX, e.clientY);
  UI.cam.x += (before.x - after.x) * S; UI.cam.y += (before.y - after.y) * S;
}, { passive: false });
function clickMap(x, y) {
  const s = UI.s, t = tileAtScreen(x, y);
  if (UI.pickFor) {
    const f = s.fairies[UI.pickFor]; UI.pickFor = null;
    if (f && t) { FG.cmd.setTask(s, f.id, Object.assign({}, f.task, { at: { q: t.q, r: t.r } })); toast(f.name + ' 的目標地點設為 (' + t.q + ', ' + t.r + ')', 'good'); UI.rosterHtml = ''; }
    return;
  }
  if (UI.tool && UI.tool.startsWith('build:')) {
    if (!t) return;
    const r = FG.cmd.placeBlueprint(s, UI.tool.slice(6), t.q, t.r);
    if (!r.ok) toast(r.reason, 'bad'); else { const w = hex.toXY(t.q, t.r); burst(w.x, w.y, '#8fe8ff', 10, 4); }
    return;
  }
  // 同一格的物件：低空在前；已選取其中一個時，再點就換下一個
  const pickable = x => UI.layer === 'all' || (UI.layer === 'sky' ? ['barrier', 'flower', 'anchor'].includes(x.type) : FG.layerOf(x) === UI.layer);
  const list = t ? t.ents.map(id => s.ents[id]).filter(x => x && pickable(x)).sort((a, b) => (FG.layerOf(b) === 'air') - (FG.layerOf(a) === 'air')) : [];
  const curIdx = UI.sel && UI.sel.kind === 'ent' ? list.findIndex(x => x.id === UI.sel.id) : -1;
  const e = list.length ? list[(curIdx + 1) % list.length] : null;
  if (UI.tool === 'demolish') { if (e) { const r = FG.cmd.demolish(s, e.id); if (!r.ok) toast(r.reason, 'bad'); else toast('已拆除'); } return; }
  if (UI.tool === 'channel') {
    const e = list.find(x => ['barrier', 'flower', 'anchor'].includes(x.type) && x.id !== UI.chPath[UI.chPath.length - 1]) || list.find(x => ['barrier', 'flower', 'anchor'].includes(x.type));
    if (!e) return toast('請點選結界、光之錨或魔法之花', 'bad');
    if (!UI.chPath.length && e.type === 'anchor') return toast('起點必須是結界或魔法之花', 'bad');
    const last = UI.chPath.length ? s.ents[UI.chPath[UI.chPath.length - 1]] : null;
    if (last && last.id === e.id) return;
    if (last && hex.dist(last, e) > FG.CH_HOP) return toast('距離超過 ' + FG.CH_HOP + ' 格，需要中繼的光之錨', 'bad');
    UI.chPath.push(e.id); UI.sideHtml = '';
    if (UI.chPath.length >= 2 && e.type === 'flower') {
      const r = FG.cmd.buildChannel(s, UI.chPath, UI.chItem);
      if (r.ok) { toast('流動通道架設完成', 'good'); UI.chPath = []; } else { toast(r.reason, 'bad'); UI.chPath.pop(); }
    }
    return;
  }
  // 選取：精靈優先
  let best = null, bd = 18 * Math.max(1, UI.cam.z);
  for (const f of Object.values(s.fairies)) { const p = fairyScreen(f), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = f; } }
  if (best) UI.sel = { kind: 'fairy', id: best.id };
  else if (e) UI.sel = { kind: 'ent', id: e.id };
  else if (t) UI.sel = { kind: 'tile', id: hex.key(t.q, t.r) };
  else UI.sel = null;
  UI.sideHtml = '';
}
addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (e.key.toLowerCase() === 'p' && !e.ctrlKey && !e.metaKey && !e.altKey) { togglePerf(); return; }
  if (!UI.playing) return;
  UI.keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { e.preventDefault(); setSpeed(UI.speed ? 0 : 1); }
  if (e.key === '1') setLayer('all'); if (e.key === '2') setLayer('ground'); if (e.key === '3') setLayer('air'); if (e.key === '4') setLayer('sky');
  if (e.key === 'Escape') { if (UI.pickFor) UI.pickFor = null; else if (UI.tool) setTool(null); else UI.sel = null; UI.sideHtml = ''; }
});
addEventListener('keyup', e => { UI.keys[e.key.toLowerCase()] = false; });
function panKeys(dt) {
  const k = UI.keys, v = 700 * dt / UI.cam.z;
  if (k.w || k.arrowup) UI.cam.y -= v; if (k.s || k.arrowdown) UI.cam.y += v;
  if (k.a || k.arrowleft) UI.cam.x -= v; if (k.d || k.arrowright) UI.cam.x += v;
}

// ---------- 精靈列表（指令單）----------
const taskKinds = () => Object.entries(FG.TASKS).filter(([k]) => k !== 'haul' || UI.s.unlocked.includes('flower'));
function taskItems(kind) {
  const L = FG.TASKS[kind].items; if (!L) return null;
  const elems = ['陽光', '風語', '土息'];
  return L.filter(i => !elems.includes(i) || UI.s.unlocked.includes('barrier'));
}
const opt = (v, t, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`;
function atValue(f) { const a = f.task.at; return !a ? 'home' : a.flower ? 'f:' + a.flower : 'tile'; }
function rosterRow(f) {
  const s = UI.s, items = taskItems(f.task.kind), at = atValue(f), fl = FG.flowers(s);
  const atOpts = opt('home', '家', at) + fl.map(t => opt('f:' + t.id, t.name, at)).join('') + (at === 'tile' ? opt('tile', `地點 (${f.task.at.q}, ${f.task.at.r})`, at) : '') + opt('pick', '地圖上點選…', at);
  const st = f.msg ? `<span class="note">${esc(f.msg)}</span>` : fairyState(f);
  return `<tr class="${UI.sel && UI.sel.id === f.id ? 'sel' : ''}"><td><button class="link" data-act="focus" data-fid="${f.id}">${esc(f.name)}</button></td>
    <td><select data-act="tkind" data-fid="${f.id}">${taskKinds().map(([k, T]) => opt(k, T.name, f.task.kind)).join('')}</select></td>
    <td>${items ? `<select data-act="titem" data-fid="${f.id}">${f.task.item ? '' : opt('', '（請選擇）', '')}${items.map(i => opt(i, FG.ITEMS[i].icon + ' ' + i, f.task.item)).join('')}</select>` : '<span class="st">—</span>'}</td>
    <td><select data-act="tat" data-fid="${f.id}">${atOpts}</select></td>
    <td><input type="number" min="1" max="40" data-act="trad" data-fid="${f.id}" value="${f.task.radius}"></td>
    <td><select data-act="thome" data-fid="${f.id}">${fl.map(t => opt(t.id, t.name, f.home)).join('')}</select></td>
    <td><div class="bar en" title="活力 ${Math.round(f.energy)}"><i style="width:${Math.round(f.energy / 5) * 5}%"></i></div></td>
    <td>${f.hold ? FG.ITEMS[f.hold.item].icon + '×' + f.hold.n : '<span class="st">—</span>'}</td>
    <td class="stc">${st}</td></tr>`;
}
function renderRoster() {
  const s = UI.s, fs = Object.values(s.fairies), c = UI.collapse.roster;
  const html = `<div class="phead" data-act="toggle" data-id="roster"><h3>精靈（${fs.length}）</h3><span>${c ? '▸' : '▾'}</span></div>` + (c ? '' :
    `<table class="roster"><thead><tr><th>名字</th><th>動作</th><th>物品</th><th>目標地點</th><th>範圍</th><th>家</th><th>活力</th><th>手上</th><th>狀態</th></tr></thead><tbody>${fs.map(rosterRow).join('')}</tbody></table>`);
  const el = $('#roster'), a = document.activeElement;
  if (UI.drag || UI.pressed || (a && el.contains(a) && (a.tagName === 'SELECT' || a.tagName === 'INPUT'))) return;
  if (html !== UI.rosterHtml) { el.innerHTML = html; UI.rosterHtml = html; }
}
function taskChange(name, el) {
  const s = UI.s, f = s.fairies[el.dataset.fid]; if (!f) return;
  const t = Object.assign({}, f.task);
  if (name === 'tkind') { t.kind = el.value; t.item = null; }
  else if (name === 'titem') t.item = el.value;
  else if (name === 'trad') t.radius = +el.value;
  else if (name === 'thome') { FG.cmd.assignHome(s, f.id, el.value); el.blur(); UI.rosterHtml = ''; return; }
  else if (name === 'tat') {
    if (el.value === 'pick') { UI.pickFor = f.id; toast('在地圖上點選「' + f.name + '」的目標地點（右鍵取消）'); el.blur(); UI.rosterHtml = ''; return; }
    if (el.value === 'tile') { el.blur(); return; }
    t.at = el.value === 'home' ? null : { flower: el.value.slice(2) };
  }
  FG.cmd.setTask(s, f.id, t);
  el.blur(); UI.rosterHtml = ''; UI.sideHtml = '';
}
$('#roster').addEventListener('change', e => { const t = e.target; if (t.dataset.act) taskChange(t.dataset.act, t); });
$('#roster').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const b = e.target.closest('button[data-act], .phead[data-act]'); if (!b) return;
  if (b.dataset.act === 'toggle') { UI.collapse.roster = !UI.collapse.roster; UI.rosterHtml = ''; renderRoster(); }
  if (b.dataset.act === 'focus') { const f = UI.s.fairies[b.dataset.fid]; UI.cam.x = f.x * S; UI.cam.y = f.y * S; UI.sel = { kind: 'fairy', id: f.id }; UI.sideHtml = ''; UI.rosterHtml = ''; }
});

// ---------- 選單、對話框 ----------
function showMenu() {
  UI.playing = false; $('#hud').classList.add('hidden'); $('#dialog').classList.add('hidden');
  const st = store();
  $('#menu').innerHTML = `<h1>花靈物語</h1><div class="en">Fairy Garden</div><div class="ver">版本更新：${VERSION_TIME}（台北時間）</div><div class="tag">用指令單經營的魔法自動化花園</div><div class="cards">` +
    Object.entries(FG.LEVELS).map(([n, L]) => {
      n = +n; const locked = n > st.unlocked, sv = st.saves[n];
      return `<div class="card panel ${locked ? 'locked' : ''}"><h2>${L.title}</h2><div class="meta">${L.minutes}</div><p>${esc(L.intro.split('\n\n')[1] || L.intro)}</p>
        <div class="row">${locked ? '<span class="meta">🔒 完成上一章後解鎖</span>' : (sv ? `<button class="primary" data-go="cont" data-lv="${n}">繼續</button><button data-go="new" data-lv="${n}">重新開始</button>` : `<button class="primary" data-go="new" data-lv="${n}">開始</button>`)}</div></div>`;
    }).join('') + `</div><div class="help">你是一位自然德魯伊，以中央魔法之花為據點。精靈住在花裡，依照你分派的指令單採集、搬運、維護與維護設施。<br>進度會自動存在瀏覽器（localStorage）。</div><div class="row wipe"><button id="btnWipe" data-go="wipe">清空存檔</button></div>`;
  $('#menu').classList.remove('hidden');
}
// 只刪除本遊戲的鍵（fairygarden. 開頭），同一個瀏覽器裡其他網站的資料不動
function wipeSaves() {
  let ks; try { ks = FG.ownKeys(localStorage); } catch (e) { toast('無法讀取瀏覽器存放的資料：' + e.message, 'bad'); return; }
  if (!ks.length) { toast('目前沒有本遊戲的存檔'); return; }
  if (!confirm(`將刪除本遊戲在這個瀏覽器裡的 ${ks.length} 筆資料（各章進度、存檔備份、音效設定），所有章節回到未開始。其他網站的資料不受影響。確定嗎？`)) return;
  try { FG.clearOwnKeys(localStorage); } catch (e) { toast('清空失敗：' + e.message, 'bad'); return; }
  showMenu();
  toast('已清空本遊戲的存檔', 'good');
}
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-go]'); if (!b) return;
  if (b.dataset.go === 'wipe') { wipeSaves(); return; }
  const lv = +b.dataset.lv;
  if (b.dataset.go === 'cont') {
    let s; try { s = FG.load(store().saves[lv]); } catch (err) { toast('存檔讀取失敗，改為重新開始：' + err.message, 'bad'); s = FG.newGame(lv); }
    startLevel(s, false);
  } else {
    if (store().saves[lv] && !confirm('重新開始會覆蓋這一章的存檔，確定嗎？')) return;
    startLevel(FG.newGame(lv), true);
  }
});
function startLevel(s, fresh) {
  UI.s = s; UI.sel = null; UI.tool = null; UI.chPath = []; UI.pickFor = null; UI.rosterHtml = ''; UI.parts = []; UI.doneSeen = {}; UI.sideHtml = ''; UI.goalsHtml = '';
  UI.buildSeen = {}; for (const e of Object.values(s.ents)) if (e.type === 'blueprint' && e.work > 0) UI.buildSeen[e.id] = true;
  for (const g of s.goals) if (g.done) UI.doneSeen[g.id] = true;
  UI.completeShown = s.complete;
  const c = FG.centralOf(s); centerOn(c.q, c.r); UI.cam.z = 1;
  $('#menu').classList.add('hidden'); $('#hud').classList.remove('hidden');
  $('#lvTitle').textContent = FG.LEVELS[s.level].title;
  renderTools(); setSpeed(1); setLayer('all');
  UI.playing = true;
  if (fresh) { saveGame(true); dialog(FG.LEVELS[s.level].title, FG.LEVELS[s.level].intro, [['開始', closeDialog]]); }
}
function dialog(title, text, buttons) {
  const d = $('#dialog');
  d.innerHTML = `<div class="dlg panel"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"></div></div>`;
  for (const [t, fn, primary] of buttons) { const b = document.createElement('button'); b.textContent = t; if (primary !== false) b.className = 'primary'; b.onclick = fn; d.querySelector('.row').append(b); }
  d.classList.remove('hidden'); setSpeed(0);
}
function closeDialog() { $('#dialog').classList.add('hidden'); setSpeed(1); }
function showComplete() {
  const s = UI.s, m = Math.floor(s.completeAt / 60), next = FG.LEVELS[s.level + 1];
  const btns = [['繼續在本章遊玩', closeDialog, false]];
  if (next) btns.push(['前往' + next.title, () => { closeDialog(); startLevel(FG.newGame(s.level + 1), true); }]);
  else btns.push(['回到選單', () => { closeDialog(); showMenu(); }]);
  dialog('🌟 ' + FG.LEVELS[s.level].title + '　完成！', `花了遊戲時間 ${m} 分鐘。\n精靈 ${Object.keys(s.fairies).length} 隻，採收月光花 ${s.stats.produced['月光花'] || 0} 朵。` +
    (next ? '\n\n下一章已解鎖。' : '\n\n這是目前版本的最後一章。小鎮居民的供需與對外貿易將在後續章節登場。'), btns);
}

// ---------- 量測面板（P 鍵開關）----------
// 每格耗時只算 JS 執行時間（遊戲邏輯＋送出繪圖指令），顯示卡實際繪製時間要看 DevTools Performance
const Perf = { on: false, gaps: [], costs: [], lastShow: 0 };
function togglePerf() { Perf.on = !Perf.on; Perf.gaps = []; Perf.costs = []; $('#perf').classList.toggle('hidden', !Perf.on); }
function perfRecord(gap, cost, ts) {
  Perf.gaps.push(gap); Perf.costs.push(cost);
  if (Perf.gaps.length > 120) { Perf.gaps.shift(); Perf.costs.shift(); }
  if (ts - Perf.lastShow < 250) return; Perf.lastShow = ts;
  Perf.stats = perfStats();
  const st = Perf.stats;
  $('#perf').textContent = `FPS          ${st.fps.toFixed(1)}\n平均每格耗時  ${st.avg.toFixed(2)} ms\n最慢 5%      ${st.p95.toFixed(2)} ms\n粒子數        ${st.parts}\n畫布解析度    ${st.res}`;
}
function perfStats() {
  const n = Perf.costs.length, sorted = [...Perf.costs].sort((a, b) => a - b), gap = Perf.gaps.reduce((a, b) => a + b, 0) / Math.max(1, n);
  return { fps: gap > 0 ? 1000 / gap : 0, avg: Perf.costs.reduce((a, b) => a + b, 0) / Math.max(1, n), p95: n ? sorted[Math.min(n - 1, Math.floor(n * 0.95))] : 0,
    parts: UI.parts.length, res: `${cv.width}×${cv.height}（像素比 ${(window.devicePixelRatio || 1).toFixed(2)}）` };
}

// ---------- 主迴圈 ----------
let last = performance.now();
function frame(ts) {
  const gap = ts - last, t0 = performance.now();
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  if (UI.s && UI.playing) {
    UI.t += dt;
    if (UI.speed > 0) FG.tick(UI.s, dt * UI.speed);
    panKeys(dt); drainFx(); stepParts(dt); render();
    if (ts - UI.lastUi > 200) { UI.lastUi = ts; uiTick(); }
    if (ts - UI.lastSave > 20000) saveGame(true);
    const t = UI.mouse.in && !UI.drag ? tileAtScreen(UI.mouse.x, UI.mouse.y) : null;
    const tip = $('#tip');
    if (t) { const es = t.ents.map(id => UI.s.ents[id]).filter(Boolean), bp = es.find(e => e.type === 'blueprint'), names = es.filter(e => e !== bp).map(entName);
      tip.textContent = (names.length ? names.join('＋') + '・' : '') + FG.TERRAIN[t.t].name + (t.t === 'meadow' ? `（野生月光花 ${t.wild}）` : '') + (bp ? '　' + bpStatus(bp) : ''); tip.style.left = UI.mouse.x + 16 + 'px'; tip.style.top = UI.mouse.y + 16 + 'px'; }
    else tip.textContent = '';
    if (Perf.on) perfRecord(gap, performance.now() - t0, ts);
  }
  requestAnimationFrame(frame);
}
addEventListener('pointerdown', () => { UI.pressed = true; }, true);
addEventListener('pointerup', () => { UI.pressed = false; }, true);
addEventListener('beforeunload', () => { if (UI.s && UI.playing) saveGame(true); });
showMenu();
requestAnimationFrame(frame);
globalThis.FGUI = UI;
UI.perf = Perf;
UI.sfx = Sfx;
})();
</script>
</body>
